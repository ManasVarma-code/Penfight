<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9A6238"/>
      <stop offset="100%" stop-color="#5C361C"/>
    </linearGradient>
    <linearGradient id="pen1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="pen2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="64" y="64" width="384" height="384" rx="48" fill="url(#desk)" stroke="#FACC15" stroke-width="10" stroke-opacity="0.35"/>
  <!-- Crossed Pens -->
  <g transform="translate(256 256) rotate(-38)">
    <rect x="-150" y="-22" width="250" height="44" rx="22" fill="url(#pen1)"/>
    <polygon points="100,-22 158,0 100,22" fill="#E2E8F0"/>
    <polygon points="140,-7 158,0 140,7" fill="#0F172A"/>
    <rect x="-110" y="-12" width="175" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.4"/>
  </g>
  <g transform="translate(256 256) rotate(38)">
    <rect x="-150" y="-22" width="250" height="44" rx="22" fill="url(#pen2)"/>
    <polygon points="100,-22 158,0 100,22" fill="#FDE68A"/>
    <polygon points="140,-7 158,0 140,7" fill="#0F172A"/>
    <rect x="-110" y="-12" width="175" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.4"/>
  </g>
  <!-- Clash Spark -->
  <circle cx="256" cy="256" r="24" fill="#FACC15"/>
  <circle cx="256" cy="256" r="11" fill="#FFFFFF"/>
</svg>
